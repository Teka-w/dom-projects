<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[1240px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 03</span>
      </header>
     
<div class="flex flex-1 items-center justify-center py-10">
        <main class="w-full">
          <header class="mb-8 flex gap-6 items-center justify-between">
            <div>
              <h1 class="text-3xl font-semibold tracking-tight">Color palettes.</h1>
              <p class="mt-3 text-sm leading-6 text-zinc-400">Generated shades with Tailwind color names. Click a shade to copy its HEX background color.</p>
            </div>
            <button class="inline-flex h-12 shrink-0 cursor-pointer items-center justify-center gap-2 rounded-xl bg-[#D9F99D] px-5 py-3 text-sm font-semibold text-zinc-950 transition hover:bg-[#D9F99D]/90 active:scale-[0.98]">
              <svg fill="none" class="size-4" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 7v5h-5M4 17v-5h5"></path>
                <path d="M6.1 7a7 7 0 0 1 11.6-1L20 12M4 12l2.3 6A7 7 0 0 0 17.9 17"></path>
              </svg>
              Shuffle palettes
            </button>
          </header>
          <div class="mb-5 flex items-center justify-between gap-x-6 gap-y-2 border-t border-zinc-800 pt-5 text-xs text-zinc-400">
            <div class="flex items-center gap-4 font-medium tracking-wide">100 → 950 · LIGHT TO DARK</div>
            <p>Ready to explore.</p>
          </div>
          <section id="colors" class="space-y-7">
            <div>
              <h2 class="mb-3 text-sm font-semibold capitalize text-zinc-200">red</h2>
              <div class="grid grid-cols-5 gap-2 sm:gap-3 lg:grid-cols-10">
                <button class="group min-w-0 cursor-pointer rounded-xl text-center">
                  <span style="background-color: #FDE3E3;" class="block h-16 rounded-xl transition group-hover:-translate-y-1 group-hover:shadow-lg"></span>
                  <span class="mt-2 block text-xs font-medium tabular-nums text-zinc-300">100</span>
                  <span class="mt-1 block pb-1 font-mono text-[9px] text-zinc-400">#FDE3E3</span>
                </button>
              </div>
            </div>
            <div>
              <h2 class="mb-3 text-sm font-semibold capitalize text-zinc-200">amber</h2>
              <div class="grid grid-cols-5 gap-2 sm:gap-3 lg:grid-cols-10">
                <button class="group min-w-0 cursor-pointer rounded-xl text-center">
                  <span style="background-color: #FEF4E1;" class="block h-16 rounded-xl transition group-hover:-translate-y-1 group-hover:shadow-lg"></span>
                  <span class="mt-2 block text-xs font-medium tabular-nums text-zinc-300">100</span>
                  <span class="mt-1 block pb-1 font-mono text-[9px] text-zinc-400">#FEF4E1</span>
                </button>
              </div>
            </div>
            <div>
              <h2 class="mb-3 text-sm font-semibold capitalize text-zinc-200">emerald</h2>
              <div class="grid grid-cols-5 gap-2 sm:gap-3 lg:grid-cols-10">
                <button class="group min-w-0 cursor-pointer rounded-xl text-center">
                  <span style="background-color: #E4FBF4;" class="block h-16 rounded-xl transition group-hover:-translate-y-1 group-hover:shadow-lg"></span>
                  <span class="mt-2 block text-xs font-medium tabular-nums text-zinc-300">100</span>
                  <span class="mt-1 block pb-1 font-mono text-[9px] text-zinc-400">#E4FBF4</span>
                </button>
              </div>
            </div>
            <div>
              <h2 class="mb-3 text-sm font-semibold capitalize text-zinc-200">sky</h2>
              <div class="grid grid-cols-5 gap-2 sm:gap-3 lg:grid-cols-10">
                <button class="group min-w-0 cursor-pointer rounded-xl text-center">
                  <span style="background-color: #E2F5FD;" class="block h-16 rounded-xl transition group-hover:-translate-y-1 group-hover:shadow-lg"></span>
                  <span class="mt-2 block text-xs font-medium tabular-nums text-zinc-300">100</span>
                  <span class="mt-1 block pb-1 font-mono text-[9px] text-zinc-400">#E2F5FD</span>
                </button>
              </div>
            </div>
            <div>
              <h2 class="mb-3 text-sm font-semibold capitalize text-zinc-200">violet</h2>
              <div class="grid grid-cols-5 gap-2 sm:gap-3 lg:grid-cols-10">
                <button class="group min-w-0 cursor-pointer rounded-xl text-center">
                  <span style="background-color: #EBE3FD;" class="block h-16 rounded-xl transition group-hover:-translate-y-1 group-hover:shadow-lg"></span>
                  <span class="mt-2 block text-xs font-medium tabular-nums text-zinc-300">100</span>
                  <span class="mt-1 block pb-1 font-mono text-[9px] text-zinc-400">#EBE3FD</span>
                </button>
              </div>
            </div>
            <div>
              <h2 class="mb-3 text-sm font-semibold capitalize text-zinc-200">pink</h2>
              <div class="grid grid-cols-5 gap-2 sm:gap-3 lg:grid-cols-10">
                <button class="group min-w-0 cursor-pointer rounded-xl text-center">
                  <span style="background-color: #FCE3F0;" class="block h-16 rounded-xl transition group-hover:-translate-y-1 group-hover:shadow-lg"></span>
                  <span class="mt-2 block text-xs font-medium tabular-nums text-zinc-300">100</span>
                  <span class="mt-1 block pb-1 font-mono text-[9px] text-zinc-400">#FCE3F0</span>
                </button>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
