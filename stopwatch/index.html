<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#101714] font-sans text-[#f0fdf4]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#c5d9bd]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#c5d9bd]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#c5d9bd] transition-colors hover:border-[#c5d9bd]/35 hover:bg-[#c5d9bd]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#c5d9bd] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#c5d9bd]/65">The everyday collection / 04</span>
      </header>
      
<div class="flex flex-1 items-center justify-center py-10">
        <main class="w-[620px] rounded-[28px] border border-white/15 bg-[#19231e]/55 p-10">
          <header class="flex items-start justify-between">
            <div class="flex size-11 items-center justify-center rounded-xl bg-[#b5cbb2]/5 text-[#c5d9bd]">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="14" r="8"></circle>
                <path d="M12 10v4l2 2M9 2h6m-3 0v4m6 1 2-2"></path>
              </svg>
            </div>
            <p id="text" class="rounded-full border border-[#c5d9bd]/15 bg-[#b5cbb2]/5 px-3 py-1.5 text-xs font-medium text-[#c5d9bd]">Ready</p>
          </header>
          <h1 class="mt-7 text-[40px] tracking-[-1px]">Stopwatch</h1>
          <p class="mt-2 text-sm text-[#A4B9AD]">Make time for what matters.</p>
          <div class="mt-9 border-y border-[#b5cbb2]/15 py-9">
            <div class="grid grid-cols-[1fr_20px_1fr_20px_1fr] items-start">
              <div class="flex flex-col items-center gap-4">
                <span id="hour" class="font-mono text-[56px] font-light leading-none tracking-[-2px] tabular-nums text-[#edf3e8]">00</span>
                <span class="text-[9px] font-medium tracking-[2px] text-[#9bad9e]">HOURS</span>
              </div>
              <span class="text-center font-mono text-[40px] leading-[56px] text-[#5c7161]">:</span>
              <div class="flex flex-col items-center gap-4">
                <span id="minute" class="font-mono text-[56px] font-light leading-none tracking-[-2px] tabular-nums text-[#edf3e8]">00</span>
                <span class="text-[9px] font-medium tracking-[2px] text-[#9bad9e]">MINUTES</span>
              </div>
              <span class="text-center font-mono text-[40px] leading-[56px] text-[#5c7161]">:</span>
              <div class="flex flex-col items-center gap-4">
                <span id="second" class="font-mono text-[56px] font-light leading-none tracking-[-2px] tabular-nums text-[#C5D9BD]">00</span>
                <span class="text-[9px] font-medium tracking-[2px] text-[#9bad9e]">SECONDS</span>
              </div>
            </div>
          </div>
          <div class="mt-8 grid grid-cols-[2fr_1fr_1fr] gap-3">
            <button id="start-button" type="button" class="h-12 cursor-pointer rounded-xl bg-[#b5cbb2] text-sm font-semibold text-[#102418] transition-colors enabled:hover:bg-[#c5d9bd] disabled:cursor-not-allowed disabled:opacity-35">Start</button>
            <button id="pause-button" type="button" disabled class="h-12 cursor-pointer rounded-xl border border-white/10 bg-white/5 text-sm font-medium text-[#dcece2] transition-colors enabled:hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-35">Pause</button>
            <button id="reset-button" type="button" disabled class="h-12 cursor-pointer rounded-xl border border-white/10 text-sm font-medium text-[#A4B9AD] transition-colors enabled:hover:bg-white/5 enabled:hover:text-[#f0fdf4] disabled:cursor-not-allowed disabled:opacity-35">Reset</button>
          </div>
          <p class="mt-5 text-center text-xs text-[#8aa294]">A moment of focus. At your own pace.</p>
        </main>
      </div>
    </div>
  </body>
</html>
