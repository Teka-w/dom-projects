<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading · Forma</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#190b10] font-sans text-[#fff5ee] antialiased">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#ff9299]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#ff9299]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#ff9299] transition-colors hover:border-[#ff9299]/35 hover:bg-[#ff9299]/10 hover:text-[#fff5ee] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#ff9299] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#ff9299]/65">The everyday collection / 01</span>
      </header>
      <div class="flex flex-1 items-center justify-center py-10">
        <main class="flex flex-col items-center justify-center">
          <div class="mb-6 flex items-center gap-3 text-[10px] font-medium tracking-[3px] text-[#dfabb5]">
            —  LET’S GET YOU STARTED  —
          </div>
          <section class="w-[720px] h-[456px] overflow-hidden rounded-[24px] border border-[#ffffff14] bg-[#260f17]">
            <div class="px-12 pt-10">
              <div class="flex items-center justify-between ">
                <span class="font-inter text-[10px] text-[#FF9299] font-semibold tracking-[1.5px]">GETTING READY</span>
                <span class="font-inter text-[11px] text-[#C4A2AB]">01 — 03</span>
              </div>
              <h1 class="mt-7 text-[42px] font-semibold leading-tight tracking-[-1.8px]">Something good is coming.</h1>
              <p class="mt-3 text-[15px] leading-6 text-[#c4a2ab]">A little preparation for a great beginning.</p>
              <div class="mt-9 flex  justify-between items-center">
                <div class="flex items-baseline gap-[8px]">
                  <span id="counter" class="text-[112px] font-medium leading-none tracking-[-7px] text-[#FFF5EE]">0</span>
                  <span class="ml-2 text-[38px] font-light text-[#ff6470]">%</span>
                </div>
                <span id="message" class="mb-3 text-sm text-[#C4A2AB] ">Preparing your space</span>
              </div>
              <div class="mt-6 h-3 overflow-hidden rounded-full bg-[#ffffff0d]">
                <div id="loading-bar" class="h-full w-0 rounded-full bg-[#f04452] shadow-[0_0_22px_#ef334060]"></div>
              </div>
              <div class="my-[14px] flex justify-between font-mono text-[10px] tracking-[1px] text-[#b9939d]">
                <span>PREPARING YOUR EXPERIENCE</span>
                <span>JUST A MOMENT</span>
              </div>
            </div>
            <div class="flex items-center justify-center gap-2 borter-t border-[#ffffff0a] bg-[#1e0c13] px-8 py-5 text-xs text-[#c4a2ab]">
              →  Your welcome page will open automatically.
            </div>
          </section>
        </main>
      </div>
    </div>
